# =========================================================
# Decap CMS 配置（全中文后台）
# 登录方式：用你自己的 GitHub 账号（即仓库 owner 的账号）登录即可，无独立密码。
# 中文界面：通过 locale: zh 启用。
# 登录用 GitHub OAuth App（非 GitHub App）；client_id 配在 OAuth App 的回调 URL 里，不在 base_url。
# 写法约定：统一 block style，list widget 用 field:（单数），object widget 用 fields:（复数）。
# =========================================================

backend:
  name: github
  repo: zzoe110/chinadentaltravel
  branch: main
  # 自建 OAuth 代理（CloudFlare Pages Function，站内 /api/auth + /api/callback）
  # 不再依赖 Netlify 中继（它对非 Netlify 托管的站点一律 404）。
  # Decap 拼接逻辑： `${base_url}/${auth_endpoint}?provider=github&site_id=...`
  # 最终请求本站 /api/auth → 跳 GitHub 授权 → /api/callback 换 token → 回传后台。
  base_url: https://www.chinadentaltravel.com
  auth_endpoint: api/auth
  auth_scope: repo
  # GitHub OAuth App 的 Authorization callback URL 必须改为：
  #   https://www.chinadentaltravel.com/api/callback
  # 并在 CloudFlare Pages 项目环境变量里设置 GITHUB_CLIENT_SECRET（client_id 已写进函数）

locale: zh

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: simple

editor:
  preview: true

collections:
  # ---------------- 全局设置 ----------------
  - name: "site"
    label: "全局设置"
    files:
      - name: "settings"
        label: "网站全局设置"
        file: "content/site.json"
        format: "json"
        fields:
          - name: "name"
            label: "网站名称(英文)"
            widget: "string"
          - name: "nameZh"
            label: "网站名称(中文)"
            widget: "string"
          - name: "domain"
            label: "网站域名"
            widget: "string"
          - name: "tagline"
            label: "首页主标题(Slogan)"
            widget: "string"
          - name: "description"
            label: "网站简介"
            widget: "text"
          - name: "organization"
            label: "机构信息"
            widget: "object"
            fields:
              - name: "name"
                label: "机构名"
                widget: "string"
              - name: "founderClinic"
                label: "首选承接机构"
                widget: "string"
              - name: "social"
                label: "社交媒体链接"
                widget: "object"
                fields:
                  - name: "facebook"
                    label: "Facebook"
                    widget: "string"
                  - name: "instagram"
                    label: "Instagram"
                    widget: "string"
                  - name: "youtube"
                    label: "YouTube"
                    widget: "string"
          - name: "contact"
            label: "联系方式"
            widget: "object"
            fields:
              - name: "whatsapp"
                label: "WhatsApp号码(含国家码,无空格)"
                widget: "string"
                hint: "如 +8613800000000"
              - name: "whatsappDisplay"
                label: "WhatsApp显示号"
                widget: "string"
              - name: "email"
                label: "联系邮箱"
                widget: "string"
              - name: "facebook"
                label: "Facebook 链接"
                widget: "string"
              - name: "phone"
                label: "联系电话"
                widget: "string"
          - name: "seo"
            label: "SEO 设置"
            widget: "object"
            fields:
              - name: "titleSuffix"
                label: "标题后缀"
                widget: "string"
              - name: "keywords"
                label: "关键词"
                widget: "text"
              - name: "ogImage"
                label: "分享缩略图路径"
                widget: "string"
              - name: "twitter"
                label: "Twitter 账号"
                widget: "string"
          - name: "watermark"
            label: "图片水印"
            widget: "object"
            fields:
              - name: "text"
                label: "水印文字"
                widget: "string"
              - name: "enabled"
                label: "是否启用"
                widget: "boolean"
          - name: "statsCode"
            label: "统计代码(GA/GTM,直接粘贴)"
            widget: "code"
            default_language: "html"
            required: false
          - name: "disclaimer"
            label: "免责声明"
            widget: "text"
          - name: "nav"
            label: "导航菜单"
            widget: "list"
            field:
              name: "item"
              label: "菜单项"
              widget: "object"
              fields:
                - name: "label"
                  label: "文字"
                  widget: "string"
                - name: "href"
                  label: "链接"
                  widget: "string"
          - name: "whyChina"
            label: "首页·为什么选中国"
            widget: "list"
            field:
              name: "card"
              label: "卡片"
              widget: "object"
              fields:
                - name: "icon"
                  label: "图标(emoji)"
                  widget: "string"
                - name: "title"
                  label: "标题"
                  widget: "string"
                - name: "text"
                  label: "说明"
                  widget: "text"
          - name: "process"
            label: "首页·服务流程"
            widget: "list"
            field:
              name: "step"
              label: "步骤"
              widget: "object"
              fields:
                - name: "step"
                  label: "步骤号"
                  widget: "string"
                - name: "title"
                  label: "标题"
                  widget: "string"
                - name: "text"
                  label: "说明"
                  widget: "text"

  # ---------------- 治疗项目 ----------------
  - name: "services"
    label: "治疗项目"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - name: "slug"
        label: "URL标识(slug)"
        widget: "string"
        hint: "英文短横，如 dental-implants"
      - name: "name"
        label: "项目名称(英文)"
        widget: "string"
      - name: "nameZh"
        label: "项目名称(中文)"
        widget: "string"
      - name: "priority"
        label: "优先级"
        widget: "select"
        options: ["P0", "P1"]
        default: "P1"
      - name: "tagline"
        label: "一句话卖点"
        widget: "string"
      - name: "summary"
        label: "项目简介"
        widget: "text"
      - name: "priceFrom"
        label: "最低价(USD)"
        widget: "number"
      - name: "priceTo"
        label: "最高价(USD)"
        widget: "number"
      - name: "priceUnit"
        label: "价格单位"
        widget: "string"
        default: "per treatment"
      - name: "duration"
        label: "疗程时长"
        widget: "string"
      - name: "image"
        label: "封面图(留空用占位图)"
        widget: "image"
        required: false
      - name: "includes"
        label: "服务包含"
        widget: "list"
        field:
          name: "item"
          label: "条目"
          widget: "string"
      - name: "faq"
        label: "常见问题"
        widget: "list"
        field:
          name: "qa"
          label: "问答"
          widget: "object"
          fields:
            - name: "q"
              label: "问题"
              widget: "string"
            - name: "a"
              label: "回答"
              widget: "text"

  # ---------------- 目的地城市 ----------------
  - name: "cities"
    label: "目的地城市"
    folder: "content/cities"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - name: "slug"
        label: "URL标识(slug)"
        widget: "string"
        hint: "如 xingyi"
      - name: "name"
        label: "城市名(英文)"
        widget: "string"
      - name: "nameZh"
        label: "城市名(中文)"
        widget: "string"
      - name: "region"
        label: "地区"
        widget: "string"
      - name: "tagline"
        label: "城市标语"
        widget: "string"
      - name: "featured"
        label: "首页精选"
        widget: "boolean"
        default: false
      - name: "intro"
        label: "城市简介"
        widget: "text"
      - name: "tourism"
        label: "板块一·旅游目的地"
        widget: "object"
        fields:
          - name: "highlights"
            label: "旅游亮点"
            widget: "list"
            field:
              name: "spot"
              label: "景点"
              widget: "object"
              fields:
                - name: "name"
                  label: "景点名"
                  widget: "string"
                - name: "description"
                  label: "描述"
                  widget: "text"
                - name: "image"
                  label: "图片"
                  widget: "image"
                  required: false
          - name: "itinerary"
            label: "推荐行程"
            widget: "list"
            field:
              name: "dayPlan"
              label: "日程"
              widget: "object"
              fields:
                - name: "day"
                  label: "天数标签"
                  widget: "string"
                  hint: "如 Day 1"
                - name: "title"
                  label: "标题"
                  widget: "string"
                - name: "description"
                  label: "描述"
                  widget: "text"
      - name: "medical"
        label: "板块二·医疗资源"
        widget: "object"
        fields:
          - name: "advantages"
            label: "医疗优势"
            widget: "text"
      - name: "prices"
        label: "价格区间(按项目)"
        widget: "object"
        fields:
          - name: "dental-implants"
            label: "种植"
            widget: "object"
            fields:
              - name: "from"
                label: "最低(USD)"
                widget: "number"
              - name: "to"
                label: "最高(USD)"
                widget: "number"
          - name: "general-dental-care"
            label: "口腔护理"
            widget: "object"
            fields:
              - name: "from"
                label: "最低(USD)"
                widget: "number"
              - name: "to"
                label: "最高(USD)"
                widget: "number"
          - name: "teeth-whitening"
            label: "美白"
            widget: "object"
            fields:
              - name: "from"
                label: "最低(USD)"
                widget: "number"
              - name: "to"
                label: "最高(USD)"
                widget: "number"
      - name: "institutions"
        label: "承接机构"
        widget: "list"
        field:
          name: "clinic"
          label: "机构"
          widget: "object"
          fields:
            - name: "name"
              label: "机构名(英文)"
              widget: "string"
            - name: "nameZh"
              label: "机构名(中文)"
              widget: "string"
            - name: "address"
              label: "地址(英文)"
              widget: "string"
            - name: "addressZh"
              label: "地址(中文)"
              widget: "string"
            - name: "phone"
              label: "电话"
              widget: "string"
            - name: "email"
              label: "邮箱"
              widget: "string"
            - name: "website"
              label: "网站"
              widget: "string"
              required: false
            - name: "description"
              label: "机构简介"
              widget: "text"
            - name: "image"
              label: "机构图片"
              widget: "image"
              required: false
            - name: "doctors"
              label: "医生团队"
              widget: "list"
              field:
                name: "doctor"
                label: "医生"
                widget: "object"
                fields:
                  - name: "name"
                    label: "医生名(英文)"
                    widget: "string"
                  - name: "nameZh"
                    label: "医生名(中文)"
                    widget: "string"
                  - name: "title"
                    label: "职称"
                    widget: "string"
                  - name: "specialty"
                    label: "专业领域"
                    widget: "string"
                  - name: "bio"
                    label: "简介"
                    widget: "text"
                  - name: "languages"
                    label: "语言"
                    widget: "string"
                  - name: "image"
                    label: "照片"
                    widget: "image"
                    required: false

  # ---------------- 常见问题 ----------------
  - name: "faq"
    label: "常见问题"
    files:
      - name: "faq"
        label: "FAQ 列表"
        file: "content/faq.json"
        format: "json"
        fields:
          - name: "items"
            label: "问答条目"
            widget: "list"
            field:
              name: "qa"
              label: "问答"
              widget: "object"
              fields:
                - name: "q"
                  label: "问题"
                  widget: "string"
                - name: "a"
                  label: "回答"
                  widget: "text"
