# =========================================================
# Decap CMS 配置（全中文后台）
# 说明：本配置编辑的内容即网站构建所用的 JSON 文件。
# 部署到 CloudFlare Pages + GitHub 后，后台通过 GitHub 账号登录授权提交修改。
# 登录方式：用你自己的 GitHub 账号（即仓库 owner 的账号）登录即可，无独立密码。
# 中文界面：通过 locale: zh 启用（见下方）。
# =========================================================

backend:
  name: github
  repo: zzoe110/chinadentaltravel
  branch: main
  base_url: https://www.chinadentaltravel.com
  auth_scope: repo

# 全中文后台界面
locale: zh

# 媒体文件（图片）上传目录；水印由 CloudFlare Worker 在访问时叠加，
# 另可参考 src 中的 bakeWatermark 在前端上传时烘焙水印。
media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

# 发布模式：简单提交即可
publish_mode: simple

# 编辑器设置：允许切换可视化 / Markdown / HTML
editor:
  preview: true

collections:
  # ---------------- 全局设置 ----------------
  - name: "site"
    label: "全局设置"
    files:
      - name: "settings"
        label: "网站全局设置"
        file: "content/site.json"
        fields:
          - { name: "description", label: "网站简介", widget: "text" }
          - name: "contact", label: "联系方式", widget: "object", fields:
              - { name: "whatsapp", label: "WhatsApp 号码(含国家码)", widget: "string" }
              - { name: "email", label: "联系邮箱", widget: "string" }
              - { name: "phone", label: "联系电话", widget: "string" }
              - { name: "facebook", label: "Facebook 链接", widget: "string" }
          - name: "seo", label: "SEO 设置", widget: "object", fields:
              - { name: "keywords", label: "关键词", widget: "text" }
              - { name: "titleSuffix", label: "标题后缀", widget: "string" }
          - { name: "statsCode", label: "统计代码(Google Analytics / GTM 等，直接粘贴)", widget: "code", default_language: "html", required: false }
          - { name: "disclaimer", label: "免责声明", widget: "text" }

  # ---------------- 治疗项目 ----------------
  - name: "services"
    label: "治疗项目"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { name: "slug", label: "URL标识(slug)", widget: "string", hint: "英文短横，如 dental-implants" }
      - { name: "name", label: "项目名称(英文)", widget: "string" }
      - { name: "nameZh", label: "项目名称(中文)", widget: "string" }
      - { name: "priority", label: "优先级", widget: "select", options: ["P0", "P1"], default: "P1" }
      - { name: "tagline", label: "一句话卖点", widget: "string" }
      - { name: "summary", label: "项目简介", widget: "text" }
      - { name: "priceFrom", label: "最低价(USD)", widget: "number" }
      - { name: "priceTo", label: "最高价(USD)", widget: "number" }
      - { name: "priceUnit", label: "价格单位", widget: "string", default: "per treatment" }
      - { name: "duration", label: "疗程时长", widget: "string" }
      - { name: "image", label: "封面图(留空用占位图)", widget: "image", required: false }
      - name: "includes", label: "服务包含", widget: "list", field: { name: "item", label: "条目", widget: "string" }
      - name: "faq", label: "常见问题", widget: "list", fields:
          - { name: "q", label: "问题", widget: "string" }
          - { name: "a", label: "回答", widget: "text" }

  # ---------------- 目的地城市 ----------------
  - name: "cities"
    label: "目的地城市"
    folder: "content/cities"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { name: "slug", label: "URL标识(slug)", widget: "string", hint: "如 xingyi" }
      - { name: "name", label: "城市名(英文)", widget: "string" }
      - { name: "nameZh", label: "城市名(中文)", widget: "string" }
      - { name: "region", label: "地区", widget: "string" }
      - { name: "tagline", label: "城市标语", widget: "string" }
      - { name: "featured", label: "首页精选", widget: "boolean", default: false }
      - { name: "intro", label: "城市简介", widget: "text" }
      - name: "tourism", label: "板块一·旅游目的地", widget: "object", fields:
          - name: "highlights", label: "旅游亮点", widget: "list", fields:
              - { name: "name", label: "景点名", widget: "string" }
              - { name: "description", label: "描述", widget: "text" }
              - { name: "image", label: "图片", widget: "image", required: false }
          - name: "itinerary", label: "推荐行程", widget: "list", fields:
              - { name: "day", label: "天数标签", widget: "string", hint: "如 Day 1" }
              - { name: "title", label: "标题", widget: "string" }
              - { name: "description", label: "描述", widget: "text" }
      - name: "medical", label: "板块二·医疗资源", widget: "object", fields:
          - { name: "advantages", label: "医疗优势", widget: "text" }
      - name: "prices", label: "价格区间(按项目)", widget: "object", fields:
          - name: "dental-implants", label: "种植", widget: "object", fields:
              - { name: "from", label: "最低(USD)", widget: "number" }
              - { name: "to", label: "最高(USD)", widget: "number" }
          - name: "general-dental-care", label: "口腔护理", widget: "object", fields:
              - { name: "from", label: "最低(USD)", widget: "number" }
              - { name: "to", label: "最高(USD)", widget: "number" }
          - name: "teeth-whitening", label: "美白", widget: "object", fields:
              - { name: "from", label: "最低(USD)", widget: "number" }
              - { name: "to", label: "最高(USD)", widget: "number" }
      - name: "institutions", label: "承接机构", widget: "list", fields:
          - { name: "name", label: "机构名(英文)", widget: "string" }
          - { name: "nameZh", label: "机构名(中文)", widget: "string" }
          - { name: "address", label: "地址(英文)", widget: "string" }
          - { name: "addressZh", label: "地址(中文)", widget: "string" }
          - { name: "phone", label: "电话", widget: "string" }
          - { name: "email", label: "邮箱", widget: "string" }
          - { name: "website", label: "网站", widget: "string", required: false }
          - { name: "description", label: "机构简介", widget: "text" }
          - { name: "image", label: "机构图片", widget: "image", required: false }
          - name: "doctors", label: "医生团队", widget: "list", fields:
              - { name: "name", label: "医生名(英文)", widget: "string" }
              - { name: "nameZh", label: "医生名(中文)", widget: "string" }
              - { name: "title", label: "职称", widget: "string" }
              - { name: "specialty", label: "专业领域", widget: "string" }
              - { name: "bio", label: "简介", widget: "text" }
              - { name: "languages", label: "语言", widget: "string" }
              - { name: "image", label: "照片", widget: "image", required: false }

  # ---------------- 常见问题 ----------------
  - name: "faq"
    label: "常见问题"
    files:
      - name: "faq"
        label: "FAQ 列表"
        file: "content/faq.json"
        fields:
          - name: "items", label: "问答条目", widget: "list", fields:
              - { name: "q", label: "问题", widget: "string" }
              - { name: "a", label: "回答", widget: "text" }
