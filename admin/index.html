<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内容管理后台 · China Dental Travel</title>
  <meta name="robots" content="noindex" />
  <!-- 全中文后台：Decap CMS 通过 config.yml 的 locale: zh 启用中文界面 -->
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 确保后台界面使用中文（config.yml 已设置 locale: zh；
    // 若需本地无 GitHub 预览，可将 config.yml 的 backend 改为 local）
    if (window.CMS) {
      window.CMS.init({ locale: "zh" });
    }
  </script>
</body>
</html>
